version: "3.9"

services:
  # ─── FastAPI Backend ─────────────────────────
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ─── Ollama (optional — for local LLM) ──────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    profiles:
      - local-llm

volumes:
  ollama_data:
